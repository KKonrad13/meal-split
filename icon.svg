<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#007AFF"/>
  <!-- plate circle -->
  <circle cx="50" cy="54" r="30" fill="none" stroke="white" stroke-width="4" opacity="0.9"/>
  <!-- dividing line -->
  <line x1="50" y1="24" x2="50" y2="84" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <!-- left portion fill -->
  <path d="M50 54 A30 30 0 0 1 20 54 A30 30 0 0 1 50 24 Z" fill="white" opacity="0.2"/>
  <!-- right portion fill (smaller) -->
  <path d="M50 54 A30 30 0 0 0 80 54 A30 30 0 0 0 50 54 Z" fill="white" opacity="0.1"/>
  <!-- fork handle (left side) -->
  <line x1="35" y1="18" x2="35" y2="30" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="31" y1="18" x2="31" y2="25" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="18" x2="35" y2="25" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="39" y1="18" x2="39" y2="25" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
